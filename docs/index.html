<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курс Python</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css">
<link rel="stylesheet" href="./styles.css">
<!-- конспект открывается панелью прямо здесь, поэтому его стили нужны и тут -->
<link rel="stylesheet" href="./pygments.css">
<link rel="stylesheet" href="./theory.css">
</head>
<body>

<header class="topbar">
  <span class="brand" data-href="#/">python-course</span>
  <nav class="tabs">
    <button class="tab" data-href="#/theory" id="tab-theory">теория</button>
    <button class="tab" data-href="#/" id="tab-practice">практика</button>
  </nav>
  <span class="crumbs" id="crumbs"></span>
  <span class="chip" id="chip" data-state="idle">
    <span class="chip__dot"></span><span id="chip-label">python не загружен</span>
  </span>
  <button class="btn btn--ghost" id="search" title="Найти задачу">поиск<kbd>Ctrl+K</kbd></button>
  <span class="sync" id="fs-status" data-kind="">папка не подключена</span>
  <button class="btn btn--ghost" id="settings" title="Папка курса, прогресс, экспорт">настройки</button>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="wrap" id="view"><div class="empty">загрузка…</div></main>
</div>

<!-- CodeMirror 5: работает обычными <script>, без бандлера.
     Весь контакт с ним заперт в editor.js — если библиотека отвалится,
     редактор мягко деградирует в textarea. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/selection/active-line.min.js"></script>
<!-- runmode подсвечивает готовые куски кода (данные урока, блок проверок),
     не создавая для них редактор -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/runmode/runmode.min.js"></script>

<script type="module" src="./app.js?v=e94b86d1" id="app-entry"></script>
<script>
  // Модули кэшируются браузером по отдельности. Сразу после обновления сайта
  // может собраться смесь старых и новых файлов — тогда импорт падает и
  // страница остаётся пустой. Показываем, что делать, вместо белого экрана.
  addEventListener("error", (e) => {
    const msg = String(e.message || "");
    if (!/module|import|export/i.test(msg)) return;
    const view = document.getElementById("view");
    if (!view || view.dataset.broken) return;
    view.dataset.broken = "1";
    view.innerHTML =
      '<div class="banner banner--error">Страница загрузилась частично из кэша ' +
      'после обновления сайта. Обновите жёстко: <b>Ctrl+Shift+R</b>.<br>' +
      '<span class="muted">' + msg.replace(/[<>&]/g, "") + "</span></div>";
  });
</script>
</body>
</html>
