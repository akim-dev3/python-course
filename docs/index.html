<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python-курс</title>
<style>
  :root {
    --base: #1e1e2e; --mantle: #181825; --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext0: #a6adc8; --overlay0: #6c7086;
    --mauve: #cba6f7; --lavender: #b4befe; --green: #a6e3a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--base); color: var(--text);
    font: 16px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(203,166,247,.10), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 0%, rgba(137,180,250,.08), transparent 55%);
  }
  .card {
    max-width: 560px; margin: 24px; padding: 40px;
    background: var(--surface0); border: 1px solid var(--surface1);
    border-radius: 18px; box-shadow: 0 10px 30px rgba(17,17,27,.5);
  }
  h1 { margin: 0 0 4px; font-size: 28px; color: var(--lavender); }
  .sub { color: var(--overlay0); font-size: 13px; margin-bottom: 24px; }
  ol { margin: 0; padding-left: 20px; color: var(--subtext0); font-size: 14px; }
  li { margin: 6px 0; }
  .done { color: var(--green); }
  code { background: var(--mantle); padding: 2px 6px; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Python-курс</h1>
    <div class="sub">Интерактивная платформа — в разработке</div>
    <ol>
      <li class="done">Деплой на GitHub Pages работает</li>
      <li>Парсер задач из файлов курса</li>
      <li>Запуск Python в браузере (Pyodide)</li>
      <li>Редактор, проверка, прогресс</li>
      <li>Теория с диаграммами</li>
    </ol>
  </div>
</body>
</html>
