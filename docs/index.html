<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курс Python</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="topbar">
  <span class="brand" data-href="#/" style="cursor:pointer">Python-курс</span>
  <span class="crumbs" id="crumbs"></span>
  <span class="chip" id="chip" data-state="idle">
    <span class="chip__dot"></span><span id="chip-label">Python: не загружен</span>
  </span>
  <span class="sync" id="sync-status" data-kind="">не подключено</span>
  <button class="btn btn--ghost" id="sync" title="Хранить прогресс в репозитории">Синхронизация</button>
  <button class="btn btn--ghost" id="export" title="Сохранить прогресс в файл">Экспорт</button>
  <button class="btn btn--ghost" id="import" title="Восстановить прогресс из файла">Импорт</button>
</header>

<main class="wrap" id="view">
  <div class="empty">Загрузка…</div>
</main>

<!-- CodeMirror 5: работает обычными <script>, без бандлера.
     Весь контакт с ним заперт в editor.js — если библиотека отвалится,
     редактор мягко деградирует в textarea. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/addon/selection/active-line.min.js"></script>

<script type="module" src="./app.js"></script>
</body>
</html>
