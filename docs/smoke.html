<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smoke — проверка рантайма</title>
<style>
  body { background:#1e1e2e; color:#cdd6f4; font:14px/1.5 ui-monospace,Consolas,monospace; margin:0; padding:24px; }
  h1 { font-size:16px; color:#b4befe; margin:0 0 12px; }
  #status { padding:8px 12px; background:#313244; border-radius:8px; margin-bottom:12px; }
  textarea { width:100%; height:220px; background:#181825; color:#cdd6f4; border:1px solid #45475a;
             border-radius:8px; padding:12px; font:13px/1.5 ui-monospace,Consolas,monospace; }
  button { background:#cba6f7; color:#11111b; border:0; border-radius:8px; padding:9px 18px;
           font-weight:700; cursor:pointer; margin:10px 6px 10px 0; }
  pre { background:#181825; border:1px solid #45475a; border-radius:8px; padding:12px; white-space:pre-wrap; }
  .ok { color:#a6e3a1; } .fail { color:#f38ba8; } .warn { color:#f9e2af; }
</style>
</head>
<body>
<h1>smoke: Pyodide + runner + content.json</h1>
<div id="status">рантайм: не загружен</div>
<div id="task"></div>
<textarea id="code" spellcheck="false"></textarea>
<div>
  <button id="run">Проверить</button>
  <button id="solve">Подставить решение</button>
  <button id="loop">Проверить таймаут (бесконечный цикл)</button>
</div>
<pre id="out">—</pre>

<script type="module">
import { Runtime, RuntimeState } from "./runtime.js";

const $ = (id) => document.getElementById(id);
const rt = new Runtime({ timeoutMs: 5000 });

rt.addEventListener("state", (e) => {
  const d = e.detail;
  const map = {
    idle: "не загружен", loading: "загрузка", ready: "готов",
    running: "выполняется", failed: "ошибка",
  };
  let s = `рантайм: ${map[d.state] || d.state}`;
  if (d.state === "loading") {
    s += d.phase ? ` (${d.phase})` : ` ${Math.round((d.progress || 0) * 100)}%`;
  }
  if (d.state === "ready" && rt.bootMs) s += ` — старт ${(rt.bootMs / 1000).toFixed(1)} с`;
  if (d.error) s += ` — ${d.error}`;
  $("status").textContent = s;
});

const content = await (await fetch("./content.json")).json();
const lesson = content.lessons.find((l) => l.id === "m06-p1");
const task = lesson.tasks.find((t) => t.name === "is_balanced");

$("task").innerHTML = `<p><b>${task.title}</b></p>${task.description_html}`;
$("code").value = task.starter_code;

const SOLUTION = `def is_balanced(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for ch in s:
        if ch in "([{":
            stack.append(ch)
        elif ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
    return not stack
`;

function payload(overrideCode) {
  return {
    prelude: lesson.prelude,
    units: lesson.tasks.map((t) => ({
      id: t.id,
      code: t.id === task.id ? overrideCode : (t.reference_solution || t.starter_code),
    })),
    blocks: [{ task: task.id, code: task.test_source }],
  };
}

async function go(code) {
  $("out").textContent = "…";
  try {
    const rep = await rt.run(payload(code));
    const b = rep.blocks[0];
    const lines = [];
    if (rep.prelude_error) lines.push(`prelude: ${JSON.stringify(rep.prelude_error)}`);
    for (const u of rep.units) lines.push(`unit ${u.task}: ${JSON.stringify(u.error)}`);
    for (const c of b.checks) {
      lines.push(`${c.ok ? "OK  " : "FAIL"} ${c.label}: ${c.actual} (ожидалось ${c.expected})`);
    }
    if (b.error) lines.push(`ОШИБКА: ${b.error.type || b.error.kind} — ${b.error.msg}` +
      (b.error.at ? ` (строка ${b.error.at.lineno})` : ""));
    const green = b.checks.length === task.expected_checks && b.checks.every((c) => c.ok) && !b.error;
    lines.push("");
    lines.push(green ? "ЗАДАЧА РЕШЕНА" : "задача не решена");
    $("out").innerHTML = lines.map((l) =>
      `<span class="${l.startsWith("OK") ? "ok" : l.startsWith("FAIL") || l.startsWith("ОШИБКА") ? "fail" : ""}">${l}</span>`
    ).join("\n");
  } catch (err) {
    $("out").innerHTML = `<span class="warn">${err.message}</span>`;
  }
}

$("run").onclick = () => go($("code").value);
$("solve").onclick = () => { $("code").value = SOLUTION; go(SOLUTION); };
$("loop").onclick = () => go("def is_balanced(s):\n    while True:\n        pass\n");

rt.preload();
</script>
</body>
</html>
